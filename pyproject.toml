[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsentinel-lite"
version = "0.1.0"
description = "Runtime-only early failure warning experiments for tool agents"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
sentinel = "agentsentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
